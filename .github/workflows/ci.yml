name: Tests and source packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ODT_NO_SETUP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -m "not integration" --junitxml=artifacts/unit.xml
      - run: python scripts/package_source.py
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ runner.os }}-${{ matrix.python }}
          path: artifacts/unit.xml
  engines:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      ODT_REQUIRE_LIBREOFFICE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin libreoffice-writer ghostscript fonts-dejavu-core fonts-noto-core libraqm0 libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -vv -m integration --junitxml=artifacts/integration.xml
      - run: python -m scripts.benchmark_documents --output artifacts/ci-benchmark --large-pages 40 --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-document-engines
          path: |
            artifacts/integration.xml
            artifacts/ci-benchmark/report.*
  libreoffice_windows:
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      ODT_REQUIRE_LIBREOFFICE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        run: |
          choco install libreoffice-fresh --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0,3010)) { exit $LASTEXITCODE }
          exit 0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -vv tests/test_documents.py::test_real_docx_to_pdf --junitxml=artifacts/libreoffice.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-libreoffice
          path: artifacts/libreoffice.xml
