name: Tests and source packaging
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  retire_obsolete_runs:
    if: startsWith(github.head_ref || github.ref_name, 'release/linux-windows-') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Stop older checks for this release branch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
          CURRENT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          import json,os,urllib.error,urllib.parse,urllib.request
          root='https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/runs'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          query=urllib.parse.urlencode({'branch':os.environ['RELEASE_BRANCH'],'per_page':100})
          with urllib.request.urlopen(urllib.request.Request(root+'?'+query,headers=headers),timeout=30) as response:
              runs=json.load(response)['workflow_runs']
          for run in runs:
              if run['head_sha']!=os.environ['CURRENT_COMMIT'] and run['status'] in ('queued','in_progress','waiting','pending','requested'):
                  request=urllib.request.Request(root+'/'+str(run['id'])+'/cancel',headers=headers,data=b'',method='POST')
                  try:
                      with urllib.request.urlopen(request,timeout=30):pass
                      print('Cancelled superseded run',run['id'])
                  except urllib.error.HTTPError as error:
                      if error.code!=409:raise
                      print('Run already stopped or finishing',run['id'])
  unit:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      ODT_NO_SETUP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -vv -m "not integration" --junitxml=artifacts/unit.xml
      - run: python scripts/package_source.py
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ runner.os }}-${{ matrix.python }}
          path: artifacts/unit.xml
  engines:
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      ODT_REQUIRE_LIBREOFFICE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin libreoffice-writer ghostscript fonts-dejavu-core fonts-noto-core libraqm0 libegl1 libopengl0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest -vv -m integration --junitxml=artifacts/integration.xml
      - run: python -m scripts.benchmark_documents --output artifacts/ci-benchmark --large-pages 40 --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-document-engines
          path: |
            artifacts/integration.xml
            artifacts/ci-benchmark/report.*
  libreoffice_windows:
    timeout-minutes: 15
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      ODT_REQUIRE_LIBREOFFICE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: pwsh
        run: |
          choco install libreoffice-fresh --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0,3010)) { exit $LASTEXITCODE }
          exit 0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -vv tests/test_documents.py::test_real_docx_to_pdf --junitxml=artifacts/libreoffice.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-libreoffice
          path: artifacts/libreoffice.xml
